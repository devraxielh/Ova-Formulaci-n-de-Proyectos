<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROJECTSIA</title>
  <!-- Pantalla de carga: se ve desde el primer instante, antes de que llegue la aplicación. Los mismos estilos los usa src/components/Cargando.jsx. -->
  <style>
    body { margin: 0; }
    .carga { display: grid; justify-items: center; gap: 0.9rem; color: #64748b; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    /* Siempre en el centro exacto de la ventana, sin depender de dónde se inserte. */
    .carga--pantalla { position: fixed; inset: 0; z-index: 50; align-content: center; justify-content: center; padding: 1.5rem; background: #f8fafc; }
    .carga-marca { display: flex; align-items: center; gap: 0.6rem; color: #4f46e5; font-weight: 800; font-size: 1.5rem; letter-spacing: 0.01em; }
    .carga-barra { width: min(14rem, 60vw); height: 4px; border-radius: 999px; background: #e0e7ff; overflow: hidden; }
    .carga-barra i { display: block; width: 40%; height: 100%; border-radius: inherit; background: #4f46e5; animation: carga-desliza 1.1s ease-in-out infinite; }
    .carga p { margin: 0; font-size: 0.95rem; }
    @keyframes carga-desliza { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .carga-barra i { animation: none; width: 100%; opacity: 0.5; } }
  </style>
</head>

<body>
  <div id="root">
    <div class="carga carga--pantalla" role="status" aria-live="polite">
      <div class="carga-marca">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
        <span>PROJECTSIA</span>
      </div>
      <div class="carga-barra" aria-hidden="true"><i></i></div>
      <p>Cargando tu proyecto…</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
